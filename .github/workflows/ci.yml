name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm install --prefix backend --include=dev --workspaces=false

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --include=dev --workspaces=false

      - name: Typecheck backend
        run: node backend/node_modules/typescript/bin/tsc --noEmit -p backend/tsconfig.json

      - name: Typecheck frontend
        run: node frontend/node_modules/typescript/bin/tsc -b frontend/tsconfig.json

      - name: Build frontend
        run: npm run build --prefix frontend --workspaces=false
